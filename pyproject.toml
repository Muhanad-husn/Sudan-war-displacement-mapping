[project]
name = "sudan-displacement"
version = "0.1.0"
description = "Descriptive geographic-temporal mapping of how violence and displacement co-evolved across Sudan and its neighbors during the 2023 war."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Muhanad", email = "muhanad.a.husn@gmail.com" }]
license = { text = "MIT" }

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "requests>=2.32",
    "requests-cache>=1.2",
    "tqdm>=4.66",
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[project.optional-dependencies]
# Headline deliverable is an animated dashboard — streamlit folded in here so
# `pip install -e ".[viz,geo]"` covers the whole project (see IMPLEMENTATION_PLAN.md).
viz = [
    "plotly>=5.20",
    "kaleido>=0.2.1",        # plotly static image export (hero.png)
    "streamlit>=1.30",
]
geo = [
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyogrio>=0.7",          # geopandas IO engine (fiona not required)
    "mapclassify>=2.6",      # quantile binning for the bivariate choropleth
]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pre-commit>=3.6",
    "nbstripout>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sudan_displacement"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
